<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tap in · The Data &amp; AI Transit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400&family=Hanken+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ccircle%20cx='50'%20cy='50'%20r='42'%20fill='none'%20stroke='%23e01e5a'%20stroke-width='14'/%3E%3Crect%20x='6'%20y='40'%20width='88'%20height='20'%20fill='%231b1b1f'/%3E%3C/svg%3E" />
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <a class="auth-home" href="{{ url_for('index') }}">
      <span class="roundel roundel--brand" aria-hidden="true"><i></i></span>
      <span>The Data &amp; AI Transit</span>
    </a>

    <section class="auth-card">
      <div class="auth-card__strip" aria-hidden="true"></div>
      <div class="auth-card__body">
        <p class="auth-kicker">Returning traveller</p>
        <h1 class="auth-title">Tap in.</h1>
        <p class="auth-sub">Log in to pick up your journey where you left off.</p>

        {% if error %}<p class="auth-error" role="alert">✱ {{ error }}</p>{% endif %}

        <form method="post" action="" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <label class="field">
            <span class="field__label">Email</span>
            <input type="email" name="email" autocomplete="email" required
                   value="{{ email|default('') }}" placeholder="you@example.com" />
          </label>
          <label class="field">
            <span class="field__label">Password</span>
            <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••" />
          </label>
          <button type="submit" class="btn btn--solid btn--block">Tap in →</button>
        </form>

        <p class="auth-alt">
          No Travelcard yet? <a href="{{ url_for('register') }}">Register here</a>.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
